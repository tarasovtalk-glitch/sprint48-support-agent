<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кабинет менеджера: агент поддержки Softline Store</title>
<link rel="icon" href="../favicon/icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/roboto-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/roboto-cyrillic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="cabinet.css">
</head>
<body>
<div class="page">
  <header class="header">
    <div class="header__brand">
      <img class="header__logo" src="softline-logo.svg" width="188" height="27" alt="Softline">
      <span class="header__divider" aria-hidden="true"></span>
      <span class="header__title">Кабинет менеджера</span>
    </div>
    <button class="user" type="button" id="user" aria-haspopup="menu" aria-expanded="false" data-act="profile" hidden>
      <span class="avatar avatar--staff" aria-hidden="true">А</span>
      <span class="user__who"><span class="user__name"></span><span class="user__role"></span></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6L8 10L12 6" stroke="#85828C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <main class="body">
    <div class="canvas">
      <div class="canvas__top">
        <nav class="tabs" aria-label="Разделы кабинета">
          <a class="tab" href="#today" data-tab="today">Сегодня<span class="counter" id="todayCounter" hidden></span></a>
          <a class="tab" href="#journal" data-tab="journal">Журнал</a>
          <a class="tab" href="#knowledge" data-tab="knowledge">Знания</a>
          <a class="tab" href="#agent" data-tab="agent">Агент</a>
        </nav>
        <div id="agentStatus"></div>
      </div>
      <div class="notice" id="notice" role="status" hidden></div>
      <div id="view"></div>
    </div>
  </main>
</div>
<div class="layer" id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="demo-data.js"></script>
<script src="cabinet.js"></script>
</body>
</html>
