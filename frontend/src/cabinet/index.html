<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кабинет менеджера: агент поддержки Softline Store</title>
<link rel="icon" href="../favicon/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="cabinet.css">
</head>
<body>
<div class="page">
  <header class="header">
    <div class="header__brand">
      <img class="header__logo" src="../images/svg/softline-solutions-digital-asset.svg" width="188" height="27" alt="Softline">
      <span class="header__divider" aria-hidden="true"></span>
      <span class="header__title">Кабинет менеджера</span>
    </div>
    <div class="header__user">
      <span class="avatar avatar--40" aria-hidden="true">А</span>
      <div class="header__who"><span class="header__name">Антон</span><span class="header__role">Менеджер Store, до 18:00</span></div>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6L8 10L12 6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke="#85828C"/></svg>
    </div>
  </header>
  <main class="body">
    <div class="canvas" id="canvas">
      <div id="notice"></div>
      <div class="canvas__top">
        <nav class="tabs" aria-label="Разделы кабинета">
          <a class="tab" href="#today" data-tab="today">Сегодня<span class="counter" id="todayCounter" hidden></span></a>
          <a class="tab" href="#journal" data-tab="journal">Журнал</a>
          <a class="tab" href="#knowledge" data-tab="knowledge">Знания</a>
          <a class="tab" href="#agent" data-tab="agent">Агент</a>
        </nav>
        <span id="agentBadge"></span>
      </div>
      <div id="view" aria-live="polite"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="demo-data.js"></script>
<script src="cabinet.js"></script>
</body>
</html>
