<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Глазами клиента · SMF</title>
  <link rel="icon" href="../favicon/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../chat/chat.css">
  <style>
    :root{color-scheme:light;--ink:#20283a;--navy:#20314f;--muted:#55627a;--line:#d7deea;--bg:#f1f4f9}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    .client-nav{background:var(--navy);color:#fff}
    .client-nav div,main{max-width:960px;margin:auto;padding-inline:clamp(20px,5vw,56px)}
    .client-nav div{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .client-nav a{color:#fff;text-underline-offset:4px}
    main{padding-block:clamp(42px,9vw,110px) 100px}
    h1{max-width:700px;margin:0;font-size:clamp(38px,7vw,76px);line-height:1.02;letter-spacing:-.04em}
    main>p{margin:18px 0 28px;max-width:500px;color:var(--muted);font-size:18px}
    .client-topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:34px 0 0;padding:0;list-style:none}
    .client-topics button,.client-open{cursor:pointer;font:inherit}
    .client-topics button{width:100%;height:100%;min-height:115px;padding:18px;text-align:left;background:white;color:var(--ink);border:1px solid var(--line);border-radius:10px}
    .client-topics button:hover{border-color:var(--navy)}
    .client-topics span{display:block;margin-top:5px;color:var(--muted);font-size:14px}
    .client-open{border:0;border-radius:8px;background:var(--navy);color:white;padding:11px 18px;font-weight:600}
    .client-open:hover{background:#31466f}
    .client-open:focus-visible,.client-topics button:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
    .slc-feedback{display:none}
    @media(max-width:640px){.client-topics{grid-template-columns:1fr}.client-topics button{min-height:0}}
  </style>
</head>
<body>
  <header class="client-nav"><div><strong>SMF · Демо магазина</strong><a href="../">Вернуться на стенд</a></div></header>
  <main>
    <h1>Каталог ПО<br>и поддержка</h1>
    <p>Узнайте цену лицензии, запросите КП или задайте вопрос по заказу.</p>
    <button type="button" class="client-open" data-open-chat>Написать в чат</button>
    <ul class="client-topics" aria-label="Примеры обращений">
      <li><button type="button" data-open-chat="Нужно КП на бессрочную лицензию КриптоПро для одного компьютера"><strong>Лицензии и КП</strong><span>Уточнить цену КриптоПро</span></button></li>
      <li><button type="button" data-open-chat="Нужно защитить почту и файлы на 50 сотрудников"><strong>Подбор ПО</strong><span>Защитить почту и файлы</span></button></li>
      <li><button type="button" data-open-chat="Где закрывающие документы?"><strong>Поддержка</strong><span>Найти закрывающие документы</span></button></li>
    </ul>
  </main>
  <script src="../config.js"></script>
  <script src="../api.js"></script>
  <script src="../chat/chat.js"></script>
  <script>
    const chat = document.querySelector('#sl-chat');
    const launcher = chat.querySelector('.slc-launcher');
    const input = chat.querySelector('input[aria-label="Сообщение"]');
    document.querySelectorAll('[data-open-chat]').forEach(button => {
      button.addEventListener('click', () => {
        if (!chat.classList.contains('is-open')) launcher.click();
        if (button.dataset.openChat && !input.value.trim()) {
          input.value = button.dataset.openChat;
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }
        input.focus();
      });
    });
  </script>
</body>
</html>
